# Development backing services for DentalERP.
#
#   docker compose -f docker-compose.dev.yml up -d
#
# Host ports use a project-specific 13xxx range and bind to loopback so this
# stack can run alongside projects using the usual service ports. Override any
# of them in .env if the chosen port is already occupied on your machine.
#
# This brings up PostgreSQL, the FastAPI backend, legacy MySQL, Redis, MinIO and
# Mailpit. It does NOT run the Next.js app —
# start that on the host with `npm run dev`. Bind-mounting node_modules into a
# container is slow enough on Windows and macOS to ruin the edit-reload loop,
# and native hot reload is meaningfully better. A containerised app service can
# be added behind a compose profile later for anyone who wants one.
#
# There is no `app` service here to attach PRODUCT_TIER / SITE_ID to — the
# Next.js app runs on the host. Set PRODUCT_TIER (defaults to "full") and
# SITE_ID (defaults to "default") in your .env before `npm run dev` if you
# need to develop against the landing tier or a non-default clinic config.
#
# ---------------------------------------------------------------------------
# NEVER USE THIS FILE IN PRODUCTION.
#
# Every credential below is weak, hardcoded and public. It exists so that a new
# contributor can get a working environment without inventing passwords or
# signing up for anything. A production deployment needs real secrets, no
# published ports on the data services, and TLS — see docs/INFRASTRUCTURE.md.
# ---------------------------------------------------------------------------

# Distinct from the production stack's project name on purpose. Both files
# declare volumes called mysql-data and redis-data, and a shared project name
# would make them the same volumes — so bringing up the production stack on a
# machine that has been running this one would silently point production at a
# development database seeded with fake patients.
#
# If you were running this stack before that separation existed, clean up the
# old project once:  docker compose -p dental-erp -f docker-compose.dev.yml down -v
name: dental-erp-dev

services:
  # Target database for the FastAPI backend. MySQL remains below only while
  # unmigrated Next.js routes still depend on Prisma.
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dental_erp
      POSTGRES_USER: dental
      POSTGRES_PASSWORD: dental
    ports:
      - '127.0.0.1:${DENTAL_ERP_DEV_POSTGRES_PORT:-15432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dental -d dental_erp']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Runs `alembic upgrade head` once and exits. `docker compose ps` shows it as
  # Exited(0) — that is success.
  #
  # Separated from the backend's own startup so a failed migration fails here,
  # visibly, rather than inside a crash-looping API container.
  backend-migrate:
    build:
      context: ./backend
    restart: 'no'
    command: ['/app/.venv/bin/alembic', 'upgrade', 'head']
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BACKEND_DATABASE_URL: postgresql+asyncpg://dental:dental@postgres:5432/dental_erp

  # The FastAPI backend. Unlike the Next.js app this runs in a container: there
  # is no node_modules bind mount to make slow, and uvicorn --reload against a
  # mounted source tree is as fast as running it on the host.
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    command:
      [
        '/app/.venv/bin/uvicorn',
        'app.main:app',
        '--host',
        '0.0.0.0',
        '--port',
        '8000',
        '--reload',
      ]
    depends_on:
      postgres:
        condition: service_healthy
      backend-migrate:
        condition: service_completed_successfully
    environment:
      BACKEND_DATABASE_URL: postgresql+asyncpg://dental:dental@postgres:5432/dental_erp
      BACKEND_JWT_SECRET: development-only-change-this-secret-value
      BACKEND_CORS_ORIGINS: http://localhost:3000
      BACKEND_ENVIRONMENT: development
    ports:
      - '127.0.0.1:${DENTAL_ERP_DEV_BACKEND_PORT:-18000}:8000'
    volumes:
      # Read-only: --reload only needs to watch the tree, never write to it.
      - ./backend/app:/app/app:ro
    healthcheck:
      # The image is python:3.13-slim with no curl or wget, and runs as UID
      # 10001, so the check is a stdlib one-liner rather than a shell tool.
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health').status==200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Temporary compatibility database. Delete this service with Prisma after
  # the last TypeScript route module is migrated.
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: dental
      MYSQL_DATABASE: dental_erp
    ports:
      - '127.0.0.1:${DENTAL_ERP_DEV_MYSQL_PORT:-13306}:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -u root -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:${DENTAL_ERP_DEV_REDIS_PORT:-16379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage. Nothing uses this yet — it is here so the
  # storage work in Phase 3 has somewhere to point without every contributor
  # needing an AWS account. Console at http://localhost:19001 by default.
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: dentalerp
      MINIO_ROOT_PASSWORD: dentalerp123
    ports:
      - '127.0.0.1:${DENTAL_ERP_DEV_MINIO_PORT:-19000}:9000'
      - '127.0.0.1:${DENTAL_ERP_DEV_MINIO_CONSOLE_PORT:-19001}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: creates the uploads bucket, then exits. `docker compose ps` will
  # show it as Exited(0) — that is success, not a failure.
  #
  # Note for scripting: `docker compose up --wait` exits non-zero because of
  # this service. --wait treats any container that exits as a failed start, and
  # cannot be told that exiting is the whole point of this one. Use plain
  # `up -d` (what the README documents), or `--wait` with the four long-running
  # services named explicitly.
  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 dentalerp dentalerp123 &&
      mc mb --ignore-existing local/dental-erp-uploads &&
      echo 'bucket ready'
      "

  # Catches all outbound SMTP so email can be tested with no credentials and no
  # risk of mailing a real patient. Web UI at http://localhost:18025 by default.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - '127.0.0.1:${DENTAL_ERP_DEV_SMTP_PORT:-11025}:1025'
      - '127.0.0.1:${DENTAL_ERP_DEV_MAILPIT_UI_PORT:-18025}:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  mysql-data:
  redis-data:
  minio-data:
