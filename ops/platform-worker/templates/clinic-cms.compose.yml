name: ${COMPOSE_PROJECT_NAME:?COMPOSE_PROJECT_NAME is required}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: clinic
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      CLINIC_OWNER_PASSWORD: ${CLINIC_OWNER_PASSWORD:?required}
      CLINIC_APP_PASSWORD: ${CLINIC_APP_PASSWORD:?required}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init/00-roles.sql:/docker-entrypoint-initdb.d/00-roles.sql:ro
      - ./postgres-init/01-prod-passwords.sh:/docker-entrypoint-initdb.d/01-prod-passwords.sh:ro
    networks: ['internal']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d clinic']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  migrate:
    image: ghcr.io/natnael-wondwoesn/clinic-cms-api:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: 'no'
    command: ['alembic', 'upgrade', 'head']
    environment:
      DATABASE_URL: postgresql+asyncpg://clinic_app:${CLINIC_APP_PASSWORD}@postgres:5432/clinic
      MIGRATION_DATABASE_URL: postgresql+asyncpg://clinic_owner:${CLINIC_OWNER_PASSWORD}@postgres:5432/clinic
    depends_on:
      postgres: { condition: service_healthy }
    networks: ['internal']

  api:
    image: ghcr.io/natnael-wondwoesn/clinic-cms-api:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    command: ['uvicorn', 'clinic.main:app', '--host', '0.0.0.0', '--port', '8000']
    environment:
      DATABASE_URL: postgresql+asyncpg://clinic_app:${CLINIC_APP_PASSWORD}@postgres:5432/clinic
      MIGRATION_DATABASE_URL: postgresql+asyncpg://clinic_owner:${CLINIC_OWNER_PASSWORD}@postgres:5432/clinic
      JWT_SECRET: ${JWT_SECRET:?required}
      COOKIE_SECURE: 'true'
      DEBUG: 'false'
      LICENSE_ENFORCEMENT: ${LICENSE_ENFORCEMENT:-disabled}
      LICENSE_PRODUCT_ID: clinic-cms
      LICENSE_STATE_DIR: /app/.license-state
    volumes: ['license-state:/app/.license-state']
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    networks: ['internal']
    healthcheck:
      test: ['CMD-SHELL', 'python -c "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen(''http://localhost:8000/api/health'',timeout=3).status==200 else 1)"']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    image: ghcr.io/natnael-wondwoesn/clinic-cms-web:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:8000
    depends_on:
      api: { condition: service_healthy }
    networks:
      internal: {}
      edge:
        aliases: ['${CLIENT_SLUG:?CLIENT_SLUG is required}-web']
    healthcheck:
      test: ['CMD-SHELL', 'node -e "require(''http'').get(''http://localhost:3000/'', r => process.exit(r.statusCode < 400 ? 0 : 1)).on(''error'', () => process.exit(1))"']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  internal: { internal: true }
  edge:
    name: kora_default
    external: true

volumes:
  pgdata: {}
  license-state: {}
