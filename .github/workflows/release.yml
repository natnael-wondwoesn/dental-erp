name: Release

# Publishes a multi-architecture image to GHCR when a version tag is pushed:
#
#   git tag -a v1.0.0 -m "..." && git push origin v1.0.0
#
# It can also be run by hand from the Actions tab, which builds both
# architectures and publishes nothing. That exists so the workflow can be proven
# before the first real tag, rather than discovering a typo in it while trying
# to cut a release.
#
# Publishing is tied to a tag push and nothing else — deliberately, with no
# "publish anyway" switch. Without a version tag there is no version to publish
# under, so a manual run that pushed would either need a made-up tag or would
# leave untagged digests in the registry that nothing references.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # abinauv/dental-erp — already lowercase, which GHCR requires.
  IMAGE_NAME: ${{ github.repository }}
  DRY_RUN: ${{ github.event_name != 'push' }}

jobs:
  # The same lint, type check, unit tests and build that gate a pull request,
  # called rather than copied. A tag can be cut from any commit, and an image
  # published to a public registry for a system holding patient records should
  # not be the first place those checks are skipped.
  verify:
    name: Verify
    uses: ./.github/workflows/ci.yml

  build:
    name: Build ${{ matrix.platform }}
    needs: verify
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          # A native arm64 runner, not QEMU. Emulating a Next.js production
          # build is slow enough to push the job past its timeout, and has a
          # habit of running the emulated process out of memory. If this label
          # is ever unavailable, the fallback is a single job with
          # docker/setup-qemu-action and both platforms passed at once — same
          # result, considerably more patience required.
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Embed issuer public trust anchors
        if: github.event_name == 'push'
        run: python scripts/embed_license_trust_anchors.py --require-nonempty
        env:
          LICENSE_ISSUER_PUBLIC_KEYS_JSON: ${{ secrets.LICENSE_ISSUER_PUBLIC_KEYS_JSON }}

      - name: Name this platform for cache and artifact keys
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"
        env:
          PLATFORM: ${{ matrix.platform }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: env.DRY_RUN != 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Each architecture is pushed by digest with no tag of its own. Tagging
      # here would mean the second job to finish overwrites the first, leaving a
      # single-architecture image under a name that claims to be both. The tags
      # are attached once, to the manifest list, in the job below.
      - name: Build
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: ${{ env.DRY_RUN == 'true' && 'type=cacheonly' || format('type=image,name={0}/{1},push-by-digest=true,name-canonical=true,push=true', env.REGISTRY, env.IMAGE_NAME) }}
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}
          # Off because the digest handed to `imagetools create` below must be
          # the image manifest itself. With provenance on, buildx returns an
          # index wrapping image + attestation, and merging those produces a
          # manifest list that some runtimes will not pull.
          provenance: false

      - name: Export the digest
        if: env.DRY_RUN != 'true'
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Upload the digest
        if: env.DRY_RUN != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish manifest
    needs: build
    if: needs.build.result == 'success' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Download the digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=DentalERP
            org.opencontainers.image.description=Open-source dental clinic management system

      # `latest` deliberately excludes pre-releases: v1.2.0-rc.1 carries the
      # version tags but must not become what a fresh `docker compose up` pulls.
      - name: Create the manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${REGISTRY}/${IMAGE_NAME}@sha256:%s " *)
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}

      - name: Confirm both architectures are in the published image
        run: |
          docker buildx imagetools inspect "${REGISTRY}/${IMAGE_NAME}:${VERSION}" --format '{{json .Manifest}}' \
            | jq -r '.manifests[]? | select(.platform.os != "unknown") | "\(.platform.os)/\(.platform.architecture)"' \
            | sort > /tmp/published-platforms
          cat /tmp/published-platforms
          # A release that quietly went single-architecture is worse than one
          # that failed, because nothing tells the arm64 operator until they try.
          grep -qx 'linux/amd64' /tmp/published-platforms
          grep -qx 'linux/arm64' /tmp/published-platforms
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          VERSION: ${{ steps.meta.outputs.version }}

      - name: Summarise
        run: |
          {
            echo "### Published"
            echo ''
            echo '```'
            echo "${DOCKER_METADATA_OUTPUT_JSON}" | jq -r '.tags[]'
            echo '```'
            echo ''
            echo "Architectures: $(paste -sd', ' /tmp/published-platforms)"
          } >> "$GITHUB_STEP_SUMMARY"

  windows-license-agent:
    name: Build Windows license agent
    needs: verify
    if: github.event_name == 'push'
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Embed issuer public trust anchors
        run: python scripts/embed_license_trust_anchors.py --require-nonempty
        env:
          LICENSE_ISSUER_PUBLIC_KEYS_JSON: ${{ secrets.LICENSE_ISSUER_PUBLIC_KEYS_JSON }}
      - name: Build one-file Windows agent
        working-directory: backend
        run: |
          uv sync --frozen
          uv run pyinstaller --clean --onefile --paths . --name dental-license-agent app/licensing/windows_cli.py
      - name: Smoke-test the executable
        working-directory: backend
        shell: pwsh
        run: |
          $state = Join-Path $env:RUNNER_TEMP 'license-state'
          .\dist\dental-license-agent.exe --product-id dental-erp --state-dir $state init
          if ($LASTEXITCODE -ne 0) { throw 'Windows license agent smoke test failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: dental-license-agent-windows-amd64
          path: backend/dist/dental-license-agent.exe
          if-no-files-found: error
          retention-days: 7

  offline-windows-bundle:
    name: Assemble offline Windows USB bundle
    needs: [publish, windows-license-agent]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dental-license-agent-windows-amd64
          path: /tmp/license-agent
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Export Linux images for Docker Desktop
        env:
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          mkdir -p /tmp/dental-erp-offline/bin /tmp/dental-erp-offline/images
          APP_IMAGE="${REGISTRY}/${IMAGE_NAME}:${VERSION}"
          docker pull --platform linux/amd64 "$APP_IMAGE"
          docker pull --platform linux/amd64 mysql:8.4
          docker save --output /tmp/dental-erp-offline/images/dental-erp.tar "$APP_IMAGE"
          docker save --output /tmp/dental-erp-offline/images/mysql-8.4.tar mysql:8.4
          echo "APP_IMAGE=$APP_IMAGE" >> "$GITHUB_ENV"
      - name: Assemble and hash bundle
        env:
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          cp deploy/offline/windows/Install-Offline.ps1 /tmp/dental-erp-offline/
          cp deploy/offline/windows/Configure-Direct-Cable-Client.ps1 /tmp/dental-erp-offline/
          cp deploy/offline/windows/OfflineInstaller.psm1 /tmp/dental-erp-offline/
          cp deploy/offline/windows/compose.offline.yml /tmp/dental-erp-offline/
          cp /tmp/license-agent/dental-license-agent.exe /tmp/dental-erp-offline/bin/
          python scripts/build_offline_bundle_manifest.py \
            --root /tmp/dental-erp-offline \
            --app-version "$VERSION" \
            --app-image "$APP_IMAGE" \
            --database-image mysql:8.4
          cd /tmp
          zip -q -r "dental-erp-offline-windows-${VERSION}.zip" dental-erp-offline
          echo "BUNDLE=/tmp/dental-erp-offline-windows-${VERSION}.zip" >> "$GITHUB_ENV"
      - name: Publish bundle on the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" "$BUNDLE" --clobber
